# Goes in TrendMinerCS/sdk at .github/workflows/pages.yml
#
# Public repo, so GitHub-hosted runners are free — no need for the self-hosted
# `default-s` runners the private repo uses.
#
# Pin these actions to SHAs before merging if org policy requires it; tags are
# used here for readability.
name: Deploy docs to Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling so a merge train
# does not drop the last build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `cache: pip` here on purpose: this repo has no requirements.txt or
      # pyproject.toml for setup-python to build a cache key from, and enabling
      # it fails the job outright.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install MkDocs
        run: pip install mkdocs-material==9.5.49

      # --strict turns broken links and nav entries pointing at missing files
      # into build failures, which is how a release that was never generated
      # gets caught before it ships.
      - name: Build
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
